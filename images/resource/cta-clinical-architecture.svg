<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="ctaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2F42"/>
      <stop offset="100%" stop-color="#044737"/>
    </linearGradient>
    <linearGradient id="ctaCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="ctaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="640" height="480" rx="16" fill="url(#ctaBg)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Technical Grid Pattern -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="360" x2="640" y2="360"/>
  </g>

  <!-- Interim Status Badge -->
  <rect x="180" y="24" width="280" height="24" rx="12" fill="rgba(143,255,125,0.12)" stroke="rgba(143,255,125,0.3)"/>
  <text x="320" y="40" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#8FFF7D" text-anchor="middle" letter-spacing="0.5">INTERIM VISUAL • PENDING BRAND ASSET</text>

  <!-- Connected Workflow Pipelines -->
  <path d="M 120 180 L 320 250 L 520 180" stroke="#8FFF7D" stroke-width="2" stroke-dasharray="6 4" fill="none" opacity="0.8"/>
  <path d="M 120 340 L 320 250 L 520 340" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" fill="none" opacity="0.6"/>

  <!-- Left Layer 1: Protocol Architecture -->
  <g transform="translate(40, 130)">
    <rect width="180" height="90" rx="12" fill="url(#ctaCard)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="28" cy="30" r="10" fill="rgba(143,255,125,0.2)"/>
    <path d="M24 30h8M28 26v8" stroke="#8FFF7D" stroke-width="1.5" stroke-linecap="round"/>
    <text x="46" y="34" font-family="'Urbanist', sans-serif" font-size="14" font-weight="700" fill="#ffffff">01 Planning</text>
    <text x="20" y="62" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">Protocol structure &amp;</text>
    <text x="20" y="78" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">endpoint coherence</text>
  </g>

  <!-- Left Layer 2: Feasibility & Sites -->
  <g transform="translate(40, 290)">
    <rect width="180" height="90" rx="12" fill="url(#ctaCard)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="28" cy="30" r="10" fill="rgba(56,189,248,0.2)"/>
    <circle cx="28" cy="30" r="5" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <text x="46" y="34" font-family="'Urbanist', sans-serif" font-size="14" font-weight="700" fill="#ffffff">02 Feasibility</text>
    <text x="20" y="62" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">Evidence-based site</text>
    <text x="20" y="78" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">&amp; cohort alignment</text>
  </g>

  <!-- Center Hub: Intuivus Operating System -->
  <g transform="translate(230, 190)">
    <rect width="180" height="120" rx="16" fill="#044737" stroke="#8FFF7D" stroke-width="2" filter="url(#ctaGlow)"/>
    <rect x="45" y="16" width="90" height="20" rx="10" fill="rgba(143,255,125,0.25)"/>
    <text x="90" y="30" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#8FFF7D" text-anchor="middle" letter-spacing="1">ORCHESTRATION</text>
    <text x="90" y="62" font-family="'Urbanist', sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">TrialOps 360</text>
    <text x="90" y="84" font-family="-apple-system, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Execution OS</text>
    <circle cx="90" cy="102" r="3" fill="#8FFF7D"/>
  </g>

  <!-- Right Layer 1: Velocity & Tracking -->
  <g transform="translate(420, 130)">
    <rect width="180" height="90" rx="12" fill="url(#ctaCard)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="28" cy="30" r="10" fill="rgba(143,255,125,0.2)"/>
    <path d="M22 34l4-7 5 4 5-7" stroke="#8FFF7D" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <text x="46" y="34" font-family="'Urbanist', sans-serif" font-size="14" font-weight="700" fill="#ffffff">03 Execution</text>
    <text x="20" y="62" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">Active milestone pacing,</text>
    <text x="20" y="78" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">predictable delivery</text>
  </g>

  <!-- Right Layer 2: Ecosystem Integration -->
  <g transform="translate(420, 290)">
    <rect width="180" height="90" rx="12" fill="url(#ctaCard)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="28" cy="30" r="10" fill="rgba(143,255,125,0.2)"/>
    <rect x="23" y="25" width="10" height="10" rx="2" stroke="#8FFF7D" stroke-width="1.5" fill="none"/>
    <text x="46" y="34" font-family="'Urbanist', sans-serif" font-size="14" font-weight="700" fill="#ffffff">04 Ecosystem</text>
    <text x="20" y="62" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">Connected products,</text>
    <text x="20" y="78" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">shared trial telemetry</text>
  </g>

  <!-- Bottom Caption -->
  <text x="320" y="445" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
    Restoring Structure, Coherence, and Velocity to Clinical Development
  </text>
</svg>

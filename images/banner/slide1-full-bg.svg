<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" width="1920" height="900">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071822"/>
      <stop offset="50%" stop-color="#0B2230"/>
      <stop offset="100%" stop-color="#04272e"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2f42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#044737" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="hubGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#044737"/>
      <stop offset="100%" stop-color="#03694f"/>
    </linearGradient>
    <linearGradient id="pulseLine1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8FFF7D" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#8FFF7D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="vignetteGrad" cx="20%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#071822" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#0B2230" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#04272e" stop-opacity="0.3"/>
    </radialGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1920" height="900" fill="url(#bgGrad1)"/>

  <!-- Blueprint Coordinate Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="900"/>
    <line x1="320" y1="0" x2="320" y2="900"/>
    <line x1="480" y1="0" x2="480" y2="900"/>
    <line x1="640" y1="0" x2="640" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="960" y1="0" x2="960" y2="900"/>
    <line x1="1120" y1="0" x2="1120" y2="900"/>
    <line x1="1280" y1="0" x2="1280" y2="900"/>
    <line x1="1440" y1="0" x2="1440" y2="900"/>
    <line x1="1600" y1="0" x2="1600" y2="900"/>
    <line x1="1760" y1="0" x2="1760" y2="900"/>
    <line x1="0" y1="150" x2="1920" y2="150"/>
    <line x1="0" y1="300" x2="1920" y2="300"/>
    <line x1="0" y1="450" x2="1920" y2="450"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="750" x2="1920" y2="750"/>
  </g>

  <!-- Left Side Atmospheric Ambient Dimmer (ensures 100% text legibility) -->
  <rect width="1100" height="900" fill="url(#vignetteGrad)"/>

  <!-- Ambient Micro-constellations on Left -->
  <g fill="rgba(143,255,125,0.18)">
    <circle cx="120" cy="180" r="2"/>
    <circle cx="280" cy="240" r="1.5"/>
    <circle cx="450" cy="160" r="2.5"/>
    <circle cx="210" cy="720" r="2"/>
    <circle cx="580" cy="780" r="1.5"/>
    <circle cx="780" cy="690" r="2.5"/>
    <circle cx="850" cy="210" r="2"/>
  </g>

  <!-- ================= RIGHT SIDE: CLINICAL PROTOCOL & STRUCTURAL ARCHITECTURE ================= -->

  <!-- Outer Glass Frame Container -->
  <rect x="940" y="110" width="920" height="680" rx="24" fill="rgba(11, 34, 48, 0.65)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <rect x="960" y="130" width="880" height="54" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- System Status Lights -->
  <circle cx="985" cy="157" r="5" fill="#8FFF7D" filter="url(#glow1)"/>
  <circle cx="1005" cy="157" r="4" fill="#38bdf8"/>
  <circle cx="1023" cy="157" r="4" fill="rgba(255,255,255,0.2)"/>
  <text x="1045" y="162" font-family="'Urbanist', sans-serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="1">INTUIVUS PROTOCOL ARCHITECTURE &amp; COHERENCE ENGINE</text>
  <rect x="1620" y="142" width="200" height="30" rx="15" fill="rgba(143,255,125,0.12)" stroke="rgba(143,255,125,0.35)"/>
  <text x="1720" y="162" font-family="'Urbanist', sans-serif" font-size="11" font-weight="700" fill="#8FFF7D" text-anchor="middle" letter-spacing="0.5">CORE STATUS: SYNCHRONIZED</text>

  <!-- Connection Data Buses -->
  <path d="M 1200 310 L 1400 450" stroke="url(#pulseLine1)" stroke-width="2.5" stroke-dasharray="8 6"/>
  <path d="M 1600 310 L 1400 450" stroke="url(#pulseLine1)" stroke-width="2.5" stroke-dasharray="8 6"/>
  <path d="M 1200 590 L 1400 450" stroke="url(#pulseLine1)" stroke-width="2.5" stroke-dasharray="8 6"/>
  <path d="M 1600 590 L 1400 450" stroke="url(#pulseLine1)" stroke-width="2.5" stroke-dasharray="8 6"/>

  <!-- Module 1: Protocol Structuring & Schema Ingestion (Top Left) -->
  <g transform="translate(970, 220)">
    <rect width="320" height="150" rx="16" fill="url(#cardGrad1)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <rect x="18" y="18" width="36" height="36" rx="8" fill="#044737"/>
    <text x="36" y="42" font-family="sans-serif" font-size="18" fill="#8FFF7D" text-anchor="middle">§</text>
    <text x="66" y="34" font-family="'Urbanist', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Protocol Decomposition</text>
    <text x="66" y="49" font-family="sans-serif" font-size="11" fill="#94a3b8">Schema &amp; Endpoint Parsing</text>
    
    <!-- Mini schema tree bars -->
    <rect x="18" y="72" width="284" height="20" rx="4" fill="rgba(255,255,255,0.05)"/>
    <rect x="18" y="72" width="190" height="20" rx="4" fill="rgba(143,255,125,0.2)"/>
    <text x="28" y="86" font-family="sans-serif" font-size="10" font-weight="600" fill="#8FFF7D">Inclusion / Exclusion Logic: Validated</text>
    
    <rect x="18" y="102" width="284" height="20" rx="4" fill="rgba(255,255,255,0.05)"/>
    <rect x="18" y="102" width="230" height="20" rx="4" fill="rgba(56,189,248,0.2)"/>
    <text x="28" y="116" font-family="sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Schedule of Activities (SoA): Coherent</text>
  </g>

  <!-- Module 2: Site Feasibility & Operational Align (Top Right) -->
  <g transform="translate(1510, 220)">
    <rect width="320" height="150" rx="16" fill="url(#cardGrad1)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <rect x="18" y="18" width="36" height="36" rx="8" fill="#044737"/>
    <circle cx="36" cy="36" r="8" fill="none" stroke="#8FFF7D" stroke-width="2"/>
    <text x="66" y="34" font-family="'Urbanist', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Site Operational Model</text>
    <text x="66" y="49" font-family="sans-serif" font-size="11" fill="#94a3b8">Capacity &amp; Pipeline Alignment</text>
    
    <g transform="translate(18, 70)">
      <rect width="135" height="52" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <text x="14" y="24" font-family="sans-serif" font-size="10" fill="#94a3b8">Active Sites</text>
      <text x="14" y="44" font-family="'Urbanist', sans-serif" font-size="18" font-weight="800" fill="#ffffff">124 <tspan font-size="11" fill="#8FFF7D">Synced</tspan></text>
      
      <rect x="145" y="0" width="139" height="52" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <text x="159" y="24" font-family="sans-serif" font-size="10" fill="#94a3b8">Alignment Index</text>
      <text x="159" y="44" font-family="'Urbanist', sans-serif" font-size="18" font-weight="800" fill="#8FFF7D">99.4%</text>
    </g>
  </g>

  <!-- CENTRAL CORE ENGINE HUB -->
  <g transform="translate(1275, 370)">
    <!-- Outer Glow Rings -->
    <circle cx="125" cy="80" r="105" fill="none" stroke="rgba(143,255,125,0.15)" stroke-width="2" stroke-dasharray="10 6"/>
    <circle cx="125" cy="80" r="85" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="1.5"/>
    
    <rect width="250" height="160" rx="20" fill="url(#hubGrad1)" stroke="#8FFF7D" stroke-width="1.8" filter="url(#glow1)"/>
    <rect width="250" height="160" rx="20" fill="url(#hubGrad1)" stroke="#8FFF7D" stroke-width="1.8"/>
    
    <text x="125" y="48" font-family="'Urbanist', sans-serif" font-size="13" font-weight="800" fill="#8FFF7D" text-anchor="middle" letter-spacing="1">INTUIVUS CORE</text>
    <text x="125" y="78" font-family="'Urbanist', sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">Execution OS</text>
    <text x="125" y="104" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Structured Orchestration Layer</text>
    
    <rect x="45" y="120" width="160" height="24" rx="12" fill="rgba(0,0,0,0.3)"/>
    <circle cx="58" cy="132" r="4" fill="#8FFF7D"/>
    <text x="130" y="136" font-family="sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">0.02ms Protocol Routing</text>
  </g>

  <!-- Module 3: Execution Timeline Acceleration (Bottom Left) -->
  <g transform="translate(970, 530)">
    <rect width="320" height="150" rx="16" fill="url(#cardGrad1)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <rect x="18" y="18" width="36" height="36" rx="8" fill="#044737"/>
    <path d="M 28 42 L 36 26 L 44 42 Z" fill="#8FFF7D"/>
    <text x="66" y="34" font-family="'Urbanist', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Execution Velocity</text>
    <text x="66" y="49" font-family="sans-serif" font-size="11" fill="#94a3b8">Phase Transition Acceleration</text>
    
    <g transform="translate(18, 70)">
      <rect width="284" height="26" rx="6" fill="rgba(255,255,255,0.04)"/>
      <rect width="200" height="26" rx="6" fill="rgba(143,255,125,0.2)"/>
      <text x="12" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#8FFF7D">Study Startup Velocity</text>
      <text x="270" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="end">-42% Days</text>
      
      <rect y="34" width="284" height="26" rx="6" fill="rgba(255,255,255,0.04)"/>
      <rect y="34" width="240" height="26" rx="6" fill="rgba(56,189,248,0.2)"/>
      <text x="12" y="51" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Alignment Stability</text>
      <text x="270" y="51" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="end">99.9%</text>
    </g>
  </g>

  <!-- Module 4: Regulatory Integrity & Audit Bus (Bottom Right) -->
  <g transform="translate(1510, 530)">
    <rect width="320" height="150" rx="16" fill="url(#cardGrad1)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <rect x="18" y="18" width="36" height="36" rx="8" fill="#044737"/>
    <rect x="28" y="26" width="16" height="18" rx="2" fill="none" stroke="#8FFF7D" stroke-width="2"/>
    <text x="66" y="34" font-family="'Urbanist', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Regulatory Coherence</text>
    <text x="66" y="49" font-family="sans-serif" font-size="11" fill="#94a3b8">GCP &amp; 21 CFR Part 11 Audit Trail</text>
    
    <g transform="translate(18, 70)">
      <rect width="284" height="52" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="20" cy="26" r="6" fill="#8FFF7D"/>
      <text x="36" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Continuous Verification Hash</text>
      <text x="36" y="39" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8">SHA256: 8f4a..77b9 [VALIDATED]</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2230"/>
      <stop offset="100%" stop-color="#042125"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2f42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#044737" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#044737"/>
      <stop offset="100%" stop-color="#026146"/>
    </linearGradient>
    <linearGradient id="orbitLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FFF7D" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glowFilter3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="620" rx="20" fill="url(#bgGrad3)"/>

  <!-- Technical Grid Pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="620"/>
    <line x1="220" y1="0" x2="220" y2="620"/>
    <line x1="360" y1="0" x2="360" y2="620"/>
    <line x1="500" y1="0" x2="500" y2="620"/>
    <line x1="640" y1="0" x2="640" y2="620"/>
    <line x1="780" y1="0" x2="780" y2="620"/>
    <line x1="0" y1="120" x2="880" y2="120"/>
    <line x1="0" y1="240" x2="880" y2="240"/>
    <line x1="0" y1="360" x2="880" y2="360"/>
    <line x1="0" y1="480" x2="880" y2="480"/>
  </g>

  <!-- Top System Header Bar -->
  <rect x="40" y="30" width="800" height="50" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="65" cy="55" r="5" fill="#8FFF7D" filter="url(#glowFilter3)"/>
  <text x="85" y="60" font-family="'Urbanist', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9" letter-spacing="0.5">SLIDE 03 • ONE ECOSYSTEM FOR CLINICAL TRIAL EXECUTION</text>
  <rect x="520" y="42" width="300" height="26" rx="13" fill="rgba(143,255,125,0.12)" stroke="rgba(143,255,125,0.3)"/>
  <text x="670" y="59" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#8FFF7D" text-anchor="middle" letter-spacing="0.5">INTERIM VISUAL • PENDING BRAND ASSET</text>

  <!-- Concentric Connected Orbit Rings -->
  <circle cx="440" cy="330" r="190" stroke="rgba(143,255,125,0.15)" stroke-width="1.5" stroke-dasharray="6 6" fill="none"/>
  <circle cx="440" cy="330" r="270" stroke="rgba(56,189,248,0.12)" stroke-width="1" stroke-dasharray="8 8" fill="none"/>

  <!-- Orbital Bus Connection Rays -->
  <line x1="440" y1="250" x2="440" y2="150" stroke="url(#orbitLine)" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="560" y1="300" x2="680" y2="240" stroke="url(#orbitLine)" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="560" y1="360" x2="680" y2="420" stroke="url(#orbitLine)" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="320" y1="360" x2="200" y2="420" stroke="url(#orbitLine)" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="320" y1="300" x2="200" y2="240" stroke="url(#orbitLine)" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Central Anchor Hub: TrialOps 360 -->
  <g transform="translate(320, 260)">
    <rect width="240" height="140" rx="20" fill="url(#hubGrad)" stroke="#8FFF7D" stroke-width="2.5" filter="url(#glowFilter3)"/>
    <rect x="70" y="16" width="100" height="22" rx="11" fill="rgba(143,255,125,0.25)"/>
    <text x="120" y="31" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#8FFF7D" text-anchor="middle" letter-spacing="1">FIRST PRODUCT</text>
    <text x="120" y="66" font-family="'Urbanist', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">TrialOps 360</text>
    <text x="120" y="90" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Where the ecosystem begins</text>
    <rect x="45" y="104" width="150" height="22" rx="6" fill="rgba(0,0,0,0.3)"/>
    <text x="120" y="119" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#8FFF7D" text-anchor="middle">PLANNING &amp; FEASIBILITY</text>
  </g>

  <!-- Ecosystem Satellite 1 (North): Protocol Structuring -->
  <g transform="translate(330, 95)">
    <rect width="220" height="85" rx="12" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="28" cy="28" r="10" fill="rgba(143,255,125,0.2)"/>
    <text x="48" y="32" font-family="'Urbanist', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Protocol Suite</text>
    <text x="20" y="58" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Schedule of assessments &amp; endpoints</text>
  </g>

  <!-- Ecosystem Satellite 2 (North-East): Site Feasibility -->
  <g transform="translate(620, 190)">
    <rect width="210" height="85" rx="12" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="28" cy="28" r="10" fill="rgba(56,189,248,0.2)"/>
    <text x="48" y="32" font-family="'Urbanist', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Site Intelligence</text>
    <text x="20" y="58" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Investigator &amp; country modeling</text>
  </g>

  <!-- Ecosystem Satellite 3 (South-East): Recruitment Forecasting -->
  <g transform="translate(620, 380)">
    <rect width="210" height="85" rx="12" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="28" cy="28" r="10" fill="rgba(143,255,125,0.2)"/>
    <text x="48" y="32" font-family="'Urbanist', sans-serif" font-size="14" font-weight="700" fill="#ffffff">RecruitOps</text>
    <text x="20" y="58" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Enrollment timeline velocity</text>
  </g>

  <!-- Ecosystem Satellite 4 (South-West): Budget & Financials -->
  <g transform="translate(50, 380)">
    <rect width="210" height="85" rx="12" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="28" cy="28" r="10" fill="rgba(56,189,248,0.2)"/>
    <text x="48" y="32" font-family="'Urbanist', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Budget Intelligence</text>
    <text x="20" y="58" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Precision trial cost structuring</text>
  </g>

  <!-- Ecosystem Satellite 5 (North-West): Evidence Engine -->
  <g transform="translate(50, 190)">
    <rect width="210" height="85" rx="12" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="28" cy="28" r="10" fill="rgba(143,255,125,0.2)"/>
    <text x="48" y="32" font-family="'Urbanist', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Evidence Layer</text>
    <text x="20" y="58" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Real-world data &amp; controls</text>
  </g>

  <!-- Bottom Architecture Breadcrumb -->
  <text x="440" y="585" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle" letter-spacing="0.5">
    ONE CONNECTED OPERATING LAYER ACROSS THE FULL ARC OF CLINICAL TRIAL EXECUTION
  </text>
</svg>

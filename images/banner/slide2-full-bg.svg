<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" width="1920" height="900">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061820"/>
      <stop offset="50%" stop-color="#0B2230"/>
      <stop offset="100%" stop-color="#032b24"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2f3d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#034839" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="velocityGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#044737" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8FFF7D" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="vignetteGrad2" cx="20%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#061820" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#0B2230" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#032b24" stop-opacity="0.3"/>
    </radialGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1920" height="900" fill="url(#bgGrad2)"/>

  <!-- Blueprint Coordinate Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="900"/>
    <line x1="320" y1="0" x2="320" y2="900"/>
    <line x1="480" y1="0" x2="480" y2="900"/>
    <line x1="640" y1="0" x2="640" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="960" y1="0" x2="960" y2="900"/>
    <line x1="1120" y1="0" x2="1120" y2="900"/>
    <line x1="1280" y1="0" x2="1280" y2="900"/>
    <line x1="1440" y1="0" x2="1440" y2="900"/>
    <line x1="1600" y1="0" x2="1600" y2="900"/>
    <line x1="1760" y1="0" x2="1760" y2="900"/>
    <line x1="0" y1="150" x2="1920" y2="150"/>
    <line x1="0" y1="300" x2="1920" y2="300"/>
    <line x1="0" y1="450" x2="1920" y2="450"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="750" x2="1920" y2="750"/>
  </g>

  <!-- Left Side Atmospheric Dimmer -->
  <rect width="1100" height="900" fill="url(#vignetteGrad2)"/>

  <!-- Left Ambient Accents -->
  <g fill="rgba(56,189,248,0.15)">
    <circle cx="150" cy="220" r="2"/>
    <circle cx="380" cy="180" r="2.5"/>
    <circle cx="260" cy="740" r="1.5"/>
    <circle cx="720" cy="790" r="2"/>
    <circle cx="830" cy="260" r="2.5"/>
  </g>

  <!-- ================= RIGHT SIDE: MANDATE VELOCITY & COHERENCE TELEMETRY ================= -->

  <!-- Outer Glass Frame Container -->
  <rect x="940" y="110" width="920" height="680" rx="24" fill="rgba(11, 34, 48, 0.65)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <rect x="960" y="130" width="880" height="54" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <circle cx="985" cy="157" r="5" fill="#8FFF7D" filter="url(#glow2)"/>
  <circle cx="1005" cy="157" r="4" fill="#38bdf8"/>
  <circle cx="1023" cy="157" r="4" fill="rgba(255,255,255,0.2)"/>
  <text x="1045" y="162" font-family="'Urbanist', sans-serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="1">INTUIVUS MANDATE • TRIAL VELOCITY &amp; COHERENCE STREAM</text>
  <rect x="1620" y="142" width="200" height="30" rx="15" fill="rgba(143,255,125,0.12)" stroke="rgba(143,255,125,0.35)"/>
  <text x="1720" y="162" font-family="'Urbanist', sans-serif" font-size="11" font-weight="700" fill="#8FFF7D" text-anchor="middle" letter-spacing="0.5">VELOCITY: +45% FASTER</text>

  <!-- Large Velocity Trajectory Display (Center Top) -->
  <g transform="translate(970, 210)">
    <rect width="860" height="230" rx="18" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    
    <text x="24" y="34" font-family="'Urbanist', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Clinical Milestone Velocity Comparison</text>
    <text x="24" y="52" font-family="sans-serif" font-size="11" fill="#94a3b8">Conventional Execution Latency vs. Intuivus Unified Structure</text>
    
    <!-- Legend -->
    <circle cx="650" cy="34" r="4" fill="#f87171"/>
    <text x="662" y="38" font-family="sans-serif" font-size="10" fill="#94a3b8">Industry Baseline (Fragmented)</text>
    <circle cx="780" cy="34" r="4" fill="#8FFF7D"/>
    <text x="792" y="38" font-family="sans-serif" font-size="10" font-weight="600" fill="#8FFF7D">Intuivus Architecture</text>

    <!-- Graph Axes & Grid -->
    <line x1="60" y1="180" x2="820" y2="180" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <line x1="60" y1="80" x2="60" y2="180" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- Conventional Fragmented Line (Delayed, flat, step drops) -->
    <path d="M 60 170 C 200 165, 300 150, 420 145 C 540 140, 650 115, 820 100" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="6 4" stroke-opacity="0.6"/>
    
    <!-- Intuivus Accelerated Trajectory -->
    <path d="M 60 170 C 220 150, 360 110, 520 75 C 640 48, 720 40, 820 30" fill="none" stroke="url(#velocityGrad)" stroke-width="4" filter="url(#glow2)"/>
    <path d="M 60 170 C 220 150, 360 110, 520 75 C 640 48, 720 40, 820 30" fill="none" stroke="#8FFF7D" stroke-width="2"/>
    
    <!-- Milestones Nodes on Curve -->
    <circle cx="220" cy="148" r="5" fill="#38bdf8"/>
    <text x="220" y="136" font-family="sans-serif" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">Protocol Ingestion</text>
    
    <circle cx="520" cy="75" r="5" fill="#8FFF7D"/>
    <text x="520" y="63" font-family="sans-serif" font-size="9" font-weight="700" fill="#8FFF7D" text-anchor="middle">Site Startup Complete</text>
    
    <circle cx="820" cy="30" r="7" fill="#8FFF7D" filter="url(#glow2)"/>
    <circle cx="820" cy="30" r="4" fill="#ffffff"/>
    <text x="760" y="24" font-family="'Urbanist', sans-serif" font-size="11" font-weight="800" fill="#8FFF7D">First Patient In: -64 Days</text>
    
    <!-- Axis Labels -->
    <text x="60" y="200" font-family="sans-serif" font-size="10" fill="#64748b">Day 0</text>
    <text x="320" y="200" font-family="sans-serif" font-size="10" fill="#64748b">Startup Feasibility</text>
    <text x="570" y="200" font-family="sans-serif" font-size="10" fill="#64748b">Regulatory &amp; Ethics</text>
    <text x="800" y="200" font-family="sans-serif" font-size="10" fill="#64748b">Trial Execution</text>
  </g>

  <!-- 3 Pillar Telemetry Metrics Below -->
  
  <!-- Metric Card 1: Operational Alignment -->
  <g transform="translate(970, 465)">
    <rect width="270" height="210" rx="16" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <rect x="20" y="20" width="38" height="38" rx="8" fill="#044737"/>
    <circle cx="39" cy="39" r="8" fill="none" stroke="#8FFF7D" stroke-width="2"/>
    <text x="70" y="36" font-family="'Urbanist', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Sponsor-CRO</text>
    <text x="70" y="50" font-family="sans-serif" font-size="10" fill="#94a3b8">Operational Coherence</text>
    
    <text x="20" y="105" font-family="'Urbanist', sans-serif" font-size="34" font-weight="800" fill="#8FFF7D">98.6%</text>
    <text x="20" y="125" font-family="sans-serif" font-size="11" fill="#cbd5e1">Alignment index across global study teams</text>
    
    <rect x="20" y="150" width="230" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
    <rect x="20" y="150" width="220" height="6" rx="3" fill="#8FFF7D"/>
    <text x="20" y="180" font-family="sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Zero cross-system friction</text>
  </g>

  <!-- Metric Card 2: Cycle Time Compression -->
  <g transform="translate(1265, 465)">
    <rect width="270" height="210" rx="16" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <rect x="20" y="20" width="38" height="38" rx="8" fill="#044737"/>
    <path d="M 29 46 L 39 30 L 49 46 Z" fill="#38bdf8"/>
    <text x="70" y="36" font-family="'Urbanist', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Cycle Compression</text>
    <text x="70" y="50" font-family="sans-serif" font-size="10" fill="#94a3b8">Startup to First In</text>
    
    <text x="20" y="105" font-family="'Urbanist', sans-serif" font-size="34" font-weight="800" fill="#38bdf8">-42%</text>
    <text x="20" y="125" font-family="sans-serif" font-size="11" fill="#cbd5e1">Reduction in planning-to-execution days</text>
    
    <rect x="20" y="150" width="230" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
    <rect x="20" y="150" width="180" height="6" rx="3" fill="#38bdf8"/>
    <text x="20" y="180" font-family="sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Accelerated phase milestones</text>
  </g>

  <!-- Metric Card 3: Protocol Fidelity -->
  <g transform="translate(1560, 465)">
    <rect width="270" height="210" rx="16" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <rect x="20" y="20" width="38" height="38" rx="8" fill="#044737"/>
    <rect x="30" y="29" width="18" height="20" rx="3" fill="none" stroke="#8FFF7D" stroke-width="2"/>
    <text x="70" y="36" font-family="'Urbanist', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Execution Fidelity</text>
    <text x="70" y="50" font-family="sans-serif" font-size="10" fill="#94a3b8">Protocol Compliance</text>
    
    <text x="20" y="105" font-family="'Urbanist', sans-serif" font-size="34" font-weight="800" fill="#ffffff">99.9%</text>
    <text x="20" y="125" font-family="sans-serif" font-size="11" fill="#cbd5e1">Consistent execution across all trial sites</text>
    
    <rect x="20" y="150" width="230" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
    <rect x="20" y="150" width="228" height="6" rx="3" fill="#8FFF7D"/>
    <text x="20" y="180" font-family="sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Automated deviation prevention</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" width="1920" height="900">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05161f"/>
      <stop offset="50%" stop-color="#0B2230"/>
      <stop offset="100%" stop-color="#02302e"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2f3d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#034d3f" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="coreHubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#044737"/>
      <stop offset="50%" stop-color="#03694f"/>
      <stop offset="100%" stop-color="#0f2f42"/>
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FFF7D" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#044737" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="vignetteGrad3" cx="20%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#05161f" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#0B2230" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#02302e" stop-opacity="0.3"/>
    </radialGradient>
    <filter id="glow3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1920" height="900" fill="url(#bgGrad3)"/>

  <!-- Blueprint Coordinate Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="900"/>
    <line x1="320" y1="0" x2="320" y2="900"/>
    <line x1="480" y1="0" x2="480" y2="900"/>
    <line x1="640" y1="0" x2="640" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="960" y1="0" x2="960" y2="900"/>
    <line x1="1120" y1="0" x2="1120" y2="900"/>
    <line x1="1280" y1="0" x2="1280" y2="900"/>
    <line x1="1440" y1="0" x2="1440" y2="900"/>
    <line x1="1600" y1="0" x2="1600" y2="900"/>
    <line x1="1760" y1="0" x2="1760" y2="900"/>
    <line x1="0" y1="150" x2="1920" y2="150"/>
    <line x1="0" y1="300" x2="1920" y2="300"/>
    <line x1="0" y1="450" x2="1920" y2="450"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="750" x2="1920" y2="750"/>
  </g>

  <!-- Left Side Atmospheric Dimmer -->
  <rect width="1100" height="900" fill="url(#vignetteGrad3)"/>

  <!-- Left Ambient Accents -->
  <g fill="rgba(143,255,125,0.15)">
    <circle cx="180" cy="200" r="2"/>
    <circle cx="340" cy="170" r="1.5"/>
    <circle cx="490" cy="720" r="2.5"/>
    <circle cx="680" cy="760" r="2"/>
    <circle cx="820" cy="240" r="1.8"/>
  </g>

  <!-- ================= RIGHT SIDE: THE INTUIVUS ECOSYSTEM & TRIALOPS 360 HUB ================= -->

  <!-- Outer Glass Frame Container -->
  <rect x="940" y="110" width="920" height="680" rx="24" fill="rgba(11, 34, 48, 0.65)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <rect x="960" y="130" width="880" height="54" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <circle cx="985" cy="157" r="5" fill="#8FFF7D" filter="url(#glow3)"/>
  <circle cx="1005" cy="157" r="4" fill="#38bdf8"/>
  <circle cx="1023" cy="157" r="4" fill="rgba(255,255,255,0.2)"/>
  <text x="1045" y="162" font-family="'Urbanist', sans-serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="1">THE INTUIVUS ECOSYSTEM • TRIALOPS 360 UNIFIED EXECUTION LAYER</text>
  <rect x="1620" y="142" width="200" height="30" rx="15" fill="rgba(143,255,125,0.12)" stroke="rgba(143,255,125,0.35)"/>
  <text x="1720" y="162" font-family="'Urbanist', sans-serif" font-size="11" font-weight="700" fill="#8FFF7D" text-anchor="middle" letter-spacing="0.5">ECOSYSTEM: LIVE &amp; SYNCED</text>

  <!-- Concentric Orbital Ecosystem Rings around Center -->
  <g transform="translate(1400, 450)">
    <circle cx="0" cy="0" r="320" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <circle cx="0" cy="0" r="230" fill="none" stroke="rgba(143,255,125,0.15)" stroke-width="1.5" stroke-dasharray="12 8"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="rgba(56,189,248,0.2)" stroke-width="2" stroke-dasharray="8 6"/>
  </g>

  <!-- Vector Conduits to Satellites -->
  <line x1="1400" y1="450" x2="1140" y2="280" stroke="url(#busGrad)" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="1400" y1="450" x2="1660" y2="280" stroke="url(#busGrad)" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="1400" y1="450" x2="1140" y2="620" stroke="url(#busGrad)" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="1400" y1="450" x2="1660" y2="620" stroke="url(#busGrad)" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- Satellite Product 1: Study Startup & Feasibility (Top Left) -->
  <g transform="translate(980, 210)">
    <rect width="280" height="130" rx="16" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <rect x="16" y="16" width="34" height="34" rx="8" fill="#044737"/>
    <circle cx="33" cy="33" r="6" fill="#8FFF7D"/>
    <text x="60" y="32" font-family="'Urbanist', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Study Startup Engine</text>
    <text x="60" y="46" font-family="sans-serif" font-size="10" fill="#94a3b8">Feasibility &amp; Protocol Ingestion</text>
    <text x="16" y="85" font-family="'Urbanist', sans-serif" font-size="18" font-weight="800" fill="#8FFF7D">Instant Ingestion</text>
    <text x="16" y="105" font-family="sans-serif" font-size="11" fill="#cbd5e1">Automated site feasibility matching</text>
  </g>

  <!-- Satellite Product 2: Site Selection & Allocation (Top Right) -->
  <g transform="translate(1540, 210)">
    <rect width="280" height="130" rx="16" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <rect x="16" y="16" width="34" height="34" rx="8" fill="#044737"/>
    <circle cx="33" cy="33" r="6" fill="#38bdf8"/>
    <text x="60" y="32" font-family="'Urbanist', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Site Allocation Matrix</text>
    <text x="60" y="46" font-family="sans-serif" font-size="10" fill="#94a3b8">Predictive Capacity Scoring</text>
    <text x="16" y="85" font-family="'Urbanist', sans-serif" font-size="18" font-weight="800" fill="#38bdf8">98.2% Accuracy</text>
    <text x="16" y="105" font-family="sans-serif" font-size="11" fill="#cbd5e1">Investigator readiness telemetry</text>
  </g>

  <!-- CENTRAL CORE FLAGSHIP: TrialOps 360™ -->
  <g transform="translate(1260, 340)">
    <!-- Glowing Pulsing Aura -->
    <rect width="280" height="220" rx="24" fill="url(#coreHubGrad)" stroke="#8FFF7D" stroke-width="2" filter="url(#glow3)"/>
    <rect width="280" height="220" rx="24" fill="url(#coreHubGrad)" stroke="#8FFF7D" stroke-width="2"/>
    
    <!-- Flagship Pill Badge -->
    <rect x="65" y="22" width="150" height="24" rx="12" fill="rgba(143,255,125,0.2)" stroke="rgba(143,255,125,0.5)"/>
    <text x="140" y="38" font-family="'Urbanist', sans-serif" font-size="11" font-weight="800" fill="#8FFF7D" text-anchor="middle" letter-spacing="1">FLAGSHIP PLATFORM</text>
    
    <text x="140" y="85" font-family="'Urbanist', sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5px">TrialOps 360™</text>
    <text x="140" y="112" font-family="sans-serif" font-size="12" font-weight="600" fill="#8FFF7D" text-anchor="middle">Central Clinical Operating Core</text>
    
    <line x1="30" y1="130" x2="250" y2="130" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <!-- Real-time metrics inside hub -->
    <text x="40" y="160" font-family="sans-serif" font-size="10" fill="#94a3b8">DATA STREAM</text>
    <text x="40" y="182" font-family="'Urbanist', sans-serif" font-size="16" font-weight="800" fill="#ffffff">Continuous</text>
    
    <text x="160" y="160" font-family="sans-serif" font-size="10" fill="#94a3b8">INTEGRATION</text>
    <text x="160" y="182" font-family="'Urbanist', sans-serif" font-size="16" font-weight="800" fill="#38bdf8">Coherent API</text>
  </g>

  <!-- Satellite Product 3: Patient Recruitment & Retention (Bottom Left) -->
  <g transform="translate(980, 560)">
    <rect width="280" height="130" rx="16" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <rect x="16" y="16" width="34" height="34" rx="8" fill="#044737"/>
    <circle cx="33" cy="33" r="6" fill="#8FFF7D"/>
    <text x="60" y="32" font-family="'Urbanist', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Cohort Recruitment</text>
    <text x="60" y="46" font-family="sans-serif" font-size="10" fill="#94a3b8">Stratified Patient Streams</text>
    <text x="16" y="85" font-family="'Urbanist', sans-serif" font-size="18" font-weight="800" fill="#8FFF7D">+65% Enrollment</text>
    <text x="16" y="105" font-family="sans-serif" font-size="11" fill="#cbd5e1">Protocol eligibility pre-screening</text>
  </g>

  <!-- Satellite Product 4: Regulatory & Quality Coherence (Bottom Right) -->
  <g transform="translate(1540, 560)">
    <rect width="280" height="130" rx="16" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <rect x="16" y="16" width="34" height="34" rx="8" fill="#044737"/>
    <circle cx="33" cy="33" r="6" fill="#38bdf8"/>
    <text x="60" y="32" font-family="'Urbanist', sans-serif" font-size="14" font-weight="700" fill="#ffffff">eTMF &amp; Inspection Readiness</text>
    <text x="60" y="46" font-family="sans-serif" font-size="10" fill="#94a3b8">Active Audit Synchronization</text>
    <text x="16" y="85" font-family="'Urbanist', sans-serif" font-size="18" font-weight="800" fill="#38bdf8">100% Audit-Ready</text>
    <text x="16" y="105" font-family="sans-serif" font-size="11" fill="#cbd5e1">Zero documentation discrepancy</text>
  </g>

  <!-- Bottom Ecosystem Bar -->
  <g transform="translate(970, 715)">
    <rect width="860" height="42" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="430" y="26" font-family="'Urbanist', sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
      ONE UNIFIED LAYER • MODULAR INDIVIDUALLY • POWERFUL TOGETHER • TRIALOPS 360 CORE
    </text>
  </g>
</svg>

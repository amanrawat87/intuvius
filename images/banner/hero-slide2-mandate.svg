<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2230"/>
      <stop offset="100%" stop-color="#042125"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2f42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#044737" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#044737"/>
      <stop offset="50%" stop-color="#8FFF7D"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#044737"/>
      <stop offset="100%" stop-color="#026146"/>
    </linearGradient>
    <filter id="glowFilter2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="620" rx="20" fill="url(#bgGrad2)"/>

  <!-- Technical Grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="620"/>
    <line x1="220" y1="0" x2="220" y2="620"/>
    <line x1="360" y1="0" x2="360" y2="620"/>
    <line x1="500" y1="0" x2="500" y2="620"/>
    <line x1="640" y1="0" x2="640" y2="620"/>
    <line x1="780" y1="0" x2="780" y2="620"/>
    <line x1="0" y1="120" x2="880" y2="120"/>
    <line x1="0" y1="240" x2="880" y2="240"/>
    <line x1="0" y1="360" x2="880" y2="360"/>
    <line x1="0" y1="480" x2="880" y2="480"/>
  </g>

  <!-- Top System Header Bar -->
  <rect x="40" y="30" width="800" height="50" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="65" cy="55" r="5" fill="#8FFF7D" filter="url(#glowFilter2)"/>
  <text x="85" y="60" font-family="'Urbanist', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9" letter-spacing="0.5">SLIDE 02 • THE INTUIVUS MANDATE • VELOCITY &amp; COHERENCE</text>
  <rect x="520" y="42" width="300" height="26" rx="13" fill="rgba(143,255,125,0.12)" stroke="rgba(143,255,125,0.3)"/>
  <text x="670" y="59" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#8FFF7D" text-anchor="middle" letter-spacing="0.5">INTERIM VISUAL • PENDING BRAND ASSET</text>

  <!-- Horizontal Acceleration Wave Pipeline -->
  <path d="M 60 270 C 200 270, 240 210, 440 210 C 640 210, 680 270, 820 270" stroke="url(#pipeGrad)" stroke-width="3" fill="none" filter="url(#glowFilter2)"/>
  <path d="M 60 270 C 200 270, 240 210, 440 210 C 640 210, 680 270, 820 270" stroke="#8FFF7D" stroke-width="1.5" stroke-dasharray="8 6" fill="none"/>

  <!-- Pipeline Step 1: Restore Structure -->
  <g transform="translate(60, 150)">
    <rect width="220" height="120" rx="14" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <rect x="20" y="20" width="32" height="24" rx="6" fill="rgba(143,255,125,0.2)"/>
    <text x="36" y="36" font-family="'Urbanist', sans-serif" font-size="12" font-weight="800" fill="#8FFF7D" text-anchor="middle">01</text>
    <text x="62" y="37" font-family="'Urbanist', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Structure</text>
    <text x="20" y="70" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Removes fragmentation</text>
    <text x="20" y="88" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">across teams &amp; tools</text>
    <circle cx="200" cy="32" r="4" fill="#8FFF7D"/>
  </g>

  <!-- Pipeline Step 2: Coherence Hub -->
  <g transform="translate(330, 110)">
    <rect width="220" height="120" rx="14" fill="url(#pulseGlow)" stroke="#8FFF7D" stroke-width="2" filter="url(#glowFilter2)"/>
    <rect x="20" y="20" width="32" height="24" rx="6" fill="rgba(143,255,125,0.25)"/>
    <text x="36" y="36" font-family="'Urbanist', sans-serif" font-size="12" font-weight="800" fill="#8FFF7D" text-anchor="middle">02</text>
    <text x="62" y="37" font-family="'Urbanist', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Coherence</text>
    <text x="20" y="70" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">Synchronized operating</text>
    <text x="20" y="88" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">layer for clinical trials</text>
    <circle cx="200" cy="32" r="4" fill="#8FFF7D"/>
  </g>

  <!-- Pipeline Step 3: Velocity -->
  <g transform="translate(600, 150)">
    <rect width="220" height="120" rx="14" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <rect x="20" y="20" width="32" height="24" rx="6" fill="rgba(56,189,248,0.2)"/>
    <text x="36" y="36" font-family="'Urbanist', sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">03</text>
    <text x="62" y="37" font-family="'Urbanist', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Velocity</text>
    <text x="20" y="70" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Compressed planning cycles,</text>
    <text x="20" y="88" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">accelerated milestone speed</text>
    <circle cx="200" cy="32" r="4" fill="#38bdf8"/>
  </g>

  <!-- Lower Telemetry Dashboard Strip -->
  <g transform="translate(60, 320)">
    <!-- Metric 1: Timeline Velocity -->
    <rect x="0" y="0" width="240" height="110" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="24" y="34" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">TIMELINE COMPRESSION</text>
    <text x="24" y="72" font-family="'Urbanist', sans-serif" font-size="30" font-weight="800" fill="#8FFF7D">3.2x</text>
    <text x="95" y="68" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">faster setup velocity</text>
    <line x1="24" y1="90" x2="216" y2="90" stroke="rgba(143,255,125,0.3)" stroke-width="3" stroke-linecap="round"/>

    <!-- Metric 2: Friction Reduction -->
    <rect x="260" y="0" width="240" height="110" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="284" y="34" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">PLANNING COHERENCE</text>
    <text x="284" y="72" font-family="'Urbanist', sans-serif" font-size="30" font-weight="800" fill="#ffffff">100%</text>
    <text x="375" y="68" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">connected ecosystem</text>
    <line x1="284" y1="90" x2="476" y2="90" stroke="rgba(56,189,248,0.3)" stroke-width="3" stroke-linecap="round"/>

    <!-- Metric 3: Trial Operations Precision -->
    <rect x="520" y="0" width="240" height="110" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="544" y="34" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">PROTOCOL ALIGNMENT</text>
    <text x="544" y="72" font-family="'Urbanist', sans-serif" font-size="30" font-weight="800" fill="#8FFF7D">Zero</text>
    <text x="618" y="68" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">unmodeled drift</text>
    <line x1="544" y1="90" x2="736" y2="90" stroke="rgba(143,255,125,0.3)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Lower Manifesto Quote Banner -->
  <rect x="60" y="460" width="760" height="60" rx="12" fill="rgba(4,71,55,0.35)" stroke="rgba(143,255,125,0.25)" stroke-width="1"/>
  <text x="440" y="496" font-family="'Urbanist', sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle" font-style="italic">
    "Foundational systems that restore structure, coherence, and velocity to clinical environments."
  </text>

  <!-- Bottom Breadcrumb -->
  <text x="440" y="585" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle" letter-spacing="0.5">
    ENGINEERED PURPOSE-BUILT FOR THE TEAMS THAT RUN TRIALS • SPONSORS • CROs
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2230"/>
      <stop offset="100%" stop-color="#042125"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2f42" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#044737" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="coreGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#044737"/>
      <stop offset="100%" stop-color="#026146"/>
    </linearGradient>
    <linearGradient id="accentLine1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8FFF7D" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#8FFF7D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="subtleGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="880" height="620" rx="20" fill="url(#bgGrad1)"/>
  
  <!-- Blueprint Grid Pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="620"/>
    <line x1="200" y1="0" x2="200" y2="620"/>
    <line x1="320" y1="0" x2="320" y2="620"/>
    <line x1="440" y1="0" x2="440" y2="620"/>
    <line x1="560" y1="0" x2="560" y2="620"/>
    <line x1="680" y1="0" x2="680" y2="620"/>
    <line x1="800" y1="0" x2="800" y2="620"/>
    <line x1="0" y1="100" x2="880" y2="100"/>
    <line x1="0" y1="200" x2="880" y2="200"/>
    <line x1="0" y1="300" x2="880" y2="300"/>
    <line x1="0" y1="400" x2="880" y2="400"/>
    <line x1="0" y1="500" x2="880" y2="500"/>
  </g>

  <!-- Top System Bar -->
  <rect x="40" y="30" width="800" height="50" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="65" cy="55" r="5" fill="#8FFF7D" filter="url(#subtleGlow1)"/>
  <text x="85" y="60" font-family="'Urbanist', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9" letter-spacing="0.5">SLIDE 01 • PROTOCOL ARCHITECTURE &amp; STRUCTURE</text>
  <rect x="520" y="42" width="300" height="26" rx="13" fill="rgba(143,255,125,0.12)" stroke="rgba(143,255,125,0.3)"/>
  <text x="670" y="59" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#8FFF7D" text-anchor="middle" letter-spacing="0.5">INTERIM VISUAL • PENDING BRAND ASSET</text>

  <!-- Data Flow Connection Lines -->
  <path d="M 230 220 L 440 310" stroke="url(#accentLine1)" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M 650 220 L 440 310" stroke="url(#accentLine1)" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M 230 460 L 440 370" stroke="url(#accentLine1)" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M 650 460 L 440 370" stroke="url(#accentLine1)" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Left Node 1: Protocol Structuring -->
  <g transform="translate(70, 160)">
    <rect width="250" height="110" rx="14" fill="url(#cardGrad1)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="36" cy="38" r="14" fill="rgba(143,255,125,0.15)"/>
    <path d="M30 38h12M36 32v12" stroke="#8FFF7D" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="42" font-family="'Urbanist', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Protocol Coherence</text>
    <text x="25" y="75" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Schedule of assessments,</text>
    <text x="25" y="93" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">objective-to-endpoint alignment</text>
  </g>

  <!-- Right Node 1: Feasibility Engine -->
  <g transform="translate(560, 160)">
    <rect width="250" height="110" rx="14" fill="url(#cardGrad1)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="36" cy="38" r="14" fill="rgba(56,189,248,0.15)"/>
    <circle cx="36" cy="38" r="6" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <text x="60" y="42" font-family="'Urbanist', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Site Feasibility</text>
    <text x="25" y="75" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Cohort sizing, country allocation,</text>
    <text x="25" y="93" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">investigator engagement models</text>
  </g>

  <!-- Center Core Node: TrialOps 360 Core Orchestration -->
  <g transform="translate(320, 260)">
    <rect width="240" height="140" rx="18" fill="url(#coreGrad1)" stroke="#8FFF7D" stroke-width="2" filter="url(#subtleGlow1)"/>
    <rect x="70" y="16" width="100" height="22" rx="11" fill="rgba(143,255,125,0.2)"/>
    <text x="120" y="31" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#8FFF7D" text-anchor="middle" letter-spacing="1">FOUNDATION</text>
    <text x="120" y="66" font-family="'Urbanist', sans-serif" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">TrialOps 360</text>
    <text x="120" y="90" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Structure Engine for Trials</text>
    <rect x="40" y="104" width="160" height="22" rx="6" fill="rgba(0,0,0,0.25)"/>
    <text x="120" y="119" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#8FFF7D" text-anchor="middle">PLANNING &amp; FEASIBILITY</text>
  </g>

  <!-- Left Node 2: Operational Velocity -->
  <g transform="translate(70, 420)">
    <rect width="250" height="110" rx="14" fill="url(#cardGrad1)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="36" cy="38" r="14" fill="rgba(143,255,125,0.15)"/>
    <path d="M28 42l5-9 6 5 6-9" stroke="#8FFF7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="60" y="42" font-family="'Urbanist', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Execution Control</text>
    <text x="25" y="75" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Predictable timeline modeling,</text>
    <text x="25" y="93" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">frictionless milestone pacing</text>
  </g>

  <!-- Right Node 2: Evidence Layer -->
  <g transform="translate(560, 420)">
    <rect width="250" height="110" rx="14" fill="url(#cardGrad1)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="36" cy="38" r="14" fill="rgba(143,255,125,0.15)"/>
    <rect x="29" y="31" width="14" height="14" rx="3" stroke="#8FFF7D" stroke-width="2" fill="none"/>
    <text x="60" y="42" font-family="'Urbanist', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Evidence Base</text>
    <text x="25" y="75" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Cross-trial learnings &amp; data,</text>
    <text x="25" y="93" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">replacing assumption with proof</text>
  </g>

  <!-- Bottom Architecture Breadcrumb -->
  <text x="440" y="585" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle" letter-spacing="0.5">
    INFRASTRUCTURE FOR CLINICAL DEVELOPMENT • SPONSORS • BIOTECH • CROs
  </text>
</svg>
